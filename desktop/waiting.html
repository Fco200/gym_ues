<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src http://localhost:*;" />
  <title>Gimnasio UES · Checador</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(150deg, #1a1a2e 0%, #26263f 55%, #151529 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .wrap { text-align: center; }
    .logo { width: 84px; height: 84px; object-fit: contain; margin-bottom: 18px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }
    h1 { font-size: 26px; letter-spacing: .5px; }
    .sub { color: #b9b9d4; margin-top: 6px; font-size: 14px; }
    .clock { margin: 34px 0 6px; font-size: 64px; font-weight: 200; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
    .date { color: #b9b9d4; font-size: 17px; margin-bottom: 34px; }
    .status {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      padding: 10px 18px; border-radius: 999px; font-size: 14px; color: #ffd8a8;
    }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: #ffa94d; animation: pulse 1.2s infinite; }
    .hint { margin-top: 26px; font-size: 12px; color: #6f6f8e; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(.75);} }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="assets/ues-logo.png" alt="UES" />
    <h1>Checador de alumnos</h1>
    <p class="sub">Gimnasio UES · Universidad Estatal de Sonora</p>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>
    <div class="status"><span class="pulse"></span><span id="status">Esperando conexión con el servidor…</span></div>
    <p class="hint">La pantalla se conectará automáticamente cuando el sistema esté disponible.</p>
  </div>

  <script>
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    const statusEl = document.getElementById('status');
    const TARGET = new URLSearchParams(location.search).get('target') || 'http://localhost:4000/checador';

    function tick() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('es-MX', { hour12: false });
      dateEl.textContent = now.toLocaleDateString('es-MX', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    tick();
    setInterval(tick, 1000);

    function tryConnect() {
      const base = TARGET.replace(/\/checador\/?$/, '');
      fetch(base + '/', { cache: 'no-store' })
        .then((res) => {
          if (res.ok) {
            statusEl.textContent = 'Servidor disponible, conectando…';
            location.href = TARGET;
          } else {
            statusEl.textContent = 'Servidor no disponible, reintentando…';
          }
        })
        .catch(() => {
          statusEl.textContent = 'Esperando conexión con el servidor…';
        });
    }
    tryConnect();
    setInterval(tryConnect, 3000);
  </script>
</body>
</html>
