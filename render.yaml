# Blueprint de despliegue para Render.com
# Uso: en Render -> "New" -> "Blueprint" -> seleccionar este repositorio.
# Después de crear el servicio, llena las variables DB_* en el panel (Dashboard -> Environment).

services:
  - type: web
    name: gym-ues
    runtime: node
    plan: free
    installCommand: npm install --workspace=backend --workspace=frontend
    buildCommand: npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false        # ponlo en el panel: host del MySQL de producción
      - key: DB_PORT
        sync: false        # normalmente 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false        # base con el esquema de backend/database.sql
      - key: UPLOADS_DIR
        value: /opt/render/project/data  # disco persistente para fotos y certificados
    disks:
      - name: gym-ues-data
        mountPath: /opt/render/project/data
        sizeGB: 1